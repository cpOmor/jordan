<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="80" height="88">
  <!-- Smartphone Outline -->
  <rect x="22" y="10" width="56" height="90" rx="10" fill="#FFFFFF" stroke="#444444" stroke-width="4"/>
  <rect x="26" y="18" width="48" height="74" fill="#E8EEF5"/>
  <!-- Camera notch -->
  <circle cx="50" cy="14" r="2" fill="#666666"/>
  <!-- 911 Red Circle Logo inside phone -->
  <circle cx="50" cy="50" r="20" fill="#CE1126"/>
  <text x="50" y="56" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">911</text>
  <!-- Hand icon holding phone -->
  <path d="M 68,65 Q 85,60 88,78 Q 70,88 65,82 Z" fill="#D2B48C" stroke="#8B5A2B" stroke-width="1.5"/>
</svg>
