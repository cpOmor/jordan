<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100" height="83">
  <!-- Map Outline shape -->
  <path d="M 40,15 L 75,20 L 95,50 L 80,85 L 35,80 L 20,55 Z" fill="#D2B48C" stroke="#8B5A2B" stroke-width="2"/>
  <!-- Jordan Flag Pole & Flag on Top -->
  <line x1="60" y1="5" x2="60" y2="45" stroke="#333333" stroke-width="3"/>
  <!-- Flag Rectangles -->
  <rect x="60" y="5" width="40" height="8" fill="#000000"/>
  <rect x="60" y="13" width="40" height="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
  <rect x="60" y="21" width="40" height="8" fill="#007A3D"/>
  <!-- Flag Triangle -->
  <polygon points="60,5 78,17.5 60,29" fill="#CE1126"/>
  <!-- 7-pointed Star -->
  <circle cx="66" cy="17.5" r="2" fill="#FFFFFF"/>
</svg>
